version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartrh_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartrh
      POSTGRES_PASSWORD: smartrh_pass
      POSTGRES_DB: smartrh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrh"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: